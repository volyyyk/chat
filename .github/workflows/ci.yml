name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# CI runs repository code, including code from pull requests. Keep its token
# read-only; diagnostics are uploaded as short-lived workflow artifacts.
permissions:
  contents: read

# concurrency: свежий прогон того же ref отменяет устаревший (урок
# первого запуска Dependabot: 20 одиночных PR x 14 джоб переполнили
# очередь раннеров, прогон main стоял в очереди около часа —
# см. .github/dependabot.yml, группы там же).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  docker-server-build:
    name: Server Docker image (Node 22)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build production server image
        run: docker build --pull --file medchat-v2/server/Dockerfile --tag medchat-server-ci medchat-v2/server

  server-tests:
    name: Server tests (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies (with error diagnosis)
        run: |
          if npm install > /tmp/npm-install.log 2>&1; then
            echo "npm install OK"
          else
            echo "=== npm install FAILED, last 30 lines ==="
            tail -n 30 /tmp/npm-install.log
            grep -m 5 "npm error" /tmp/npm-install.log | while IFS= read -r line; do
              echo "::error::${line}"
            done
            exit 1
          fi

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run unit and integration tests
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; npm test -- --ci --runInBand; } 2>&1 | tee ../../ci-jest.log
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 30d

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  e2e-smoke:
    name: E2E smoke (seed + все стороны, real-time, платежи)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medchat
          POSTGRES_PASSWORD: medchat
          # NOTE: with NODE_ENV=test the server appends "_test" to DB_NAME,
          # so the real database name here must be DB_NAME + "_test"
          POSTGRES_DB: medchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: medchat
      DB_PASSWORD: medchat
      DB_NAME: medchat
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-e2e-secret
      JWT_EXPIRES_IN: 30m
      JWT_REFRESH_EXPIRES_IN: 30d
      MESSAGE_PRICE_RUB: 50
      FREE_MESSAGE_DAYS: 30
      DOCTOR_SHARE_PERCENT: 80
    defaults:
      run:
        working-directory: medchat-v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 5432 && echo "Postgres is up" && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" && exit 1

      - name: Seed test data
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; npm run seed:test; } 2>&1 | tee ../../ci-seed.log

      - name: Run E2E smoke test
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; npm run test:smoke; } 2>&1 | tee ../../ci-smoke.log

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Print server logs on failure
        if: failure()
        run: |
          echo "Smoke test failed. Recent server output:"
          ls -la logs 2>/dev/null || true
          tail -n 200 logs/error.log 2>/dev/null || true

  web-build:
    name: Web client build (React, статический бандл)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/web
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # lock-файла в web/ нет (замороженный состав deps) — npm install;
      # обновления web-мобилки управляются вручную.
      - name: Install dependencies
        run: npm install --no-audit --no-fund

      # react-scripts при CI=true роняет сборку на любых ворнингах —
      # для джобы это не хотим (CI=false), бандл обязан собраться.
      - name: Build (react-scripts)
        run: |
          set -o pipefail
          { CI=false npm run build; } 2>&1 | tee ../../ci-web-build.log

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload static bundle
        uses: actions/upload-artifact@v7
        with:
          name: medchat-web-static
          path: medchat-v2/web/build
          if-no-files-found: error
  core-tests:
    name: Rust core (medchat-core, этап 2 ROADMAP_NATIVE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable, minimal profile)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: medchat-v2/core

      # Шаг 1: полная проверка компиляции, включая napi-биндинги (src/node.rs)
      # и их #[cfg(test)]-код; feature serde добавляет к проверке методы
      # save/restore персистентности RatchetState и их тесты (node.rs).
      # cargo check не линкует бинарник, поэтому
      # napi_*-символы (которые в рантайме даёт только процесс Node —
      # libnode.so в дистрибутиве Node нет, napi-rs issue #1099) не нужны.
      # Ловит все ошибки типов (включая E0277-класс из прогона a1061cd).
      - name: Type-check core + napi bindings and tests (no linking)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo check --tests --no-default-features --features napi-bind,serde; } 2>&1 | tee ../../ci-rust.log

      # Шаг 2: юнит-тесты логики ядра (lib, ratchet, контрактные векторы)
      # — без napi-биндингов: тестовый бинарник линкуется чисто, потому что
      # napi/napi-derive исключены feature-гейтом (--no-default-features);
      # feature serde добавляет сериализационные тесты персистентности
      # RatchetState (этап 7 ROADMAP).
      - name: Run core unit tests (without napi bindings, with serde tests)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo test --no-default-features --features serde; } 2>&1 | tee -a ../../ci-rust.log

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  core-bench:
    name: Core benchmarks (Rust criterion vs Node, DoD ≥ x10)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: medchat-v2/core

      # Rust-сторона: criterion, release+LTO (benches/crypto.rs). Джоба
      # гейтит сборку и прогон бенчмарков; тайминги НЕ сравниваются
      # автоматикой — числа читаются из ci-bench.log (сверка DoD «≥ x10»
      # по логу: машины шатательны для автогейта).
      - name: Run criterion benchmarks (medchat-core)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo bench --no-default-features; } 2>&1 | tee ../../ci-bench.log

      # Зеркальная Node-сторона: те же payload/cost (bench/coreBench.js).
      - name: Run Node reference benchmarks
        working-directory: medchat-v2/server
        run: |
          npm install --no-audit --no-fund
          { echo "=== node reference ${GITHUB_RUN_ID} $(date -u) ==="; npm run bench:core; } 2>&1 | tee -a ../../ci-bench.log

      # Лог бенчмарков публикуется ВСЕГДА (не только при падении): числа
      # нужны для сверки DoD из репозитория. [skip ci] — пуш GITHUB_TOKEN
      # не запускает новые прогоны (см. комментарий в шапке workflow).
      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  napi-build:
    name: N-API artifact (.node) + Node-интеграция обёрток
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: medchat-v2/core

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      # cdylib с napi-bind + serde — это и есть .node-артефакт:
      # napi-rs2-модуль = обычный cdylib (rename-рецепт из документации
      # napi.rs), build.rs уже настроен (napi_build::setup). napi-cli нужен
      # только для прод-упаковки с метаданными платформ. serde включает
      # методы save/restore JsRatchetState (персистентность RatchetState,
      # этап 7) — их проверяет napi-smoke.js ниже.
      - name: Build cdylib into .node artifact
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo build --release --no-default-features --features napi-bind,serde; } 2>&1 | tee ../../ci-napi.log
          cp target/release/libmedchat_core.so medchat-core.linux-x64-gnu.node
          ls -la medchat-core.linux-x64-gnu.node

      # Юнит-тесты napi-обёрток в настоящем Node-процессе: в core-tests они
      # существуют лишь как компиляция, т.к. cargo test линкует тестовый
      # бинарник без napi_*-символов (их даёт только Node, issue #1099).
      - name: Node-интеграция napi-обёрток (napi-smoke.js)
        run: |
          set -o pipefail
          { node napi-smoke.js; } 2>&1 | tee -a ../../ci-napi.log

      - name: Upload .node artifact
        uses: actions/upload-artifact@v7
        with:
          name: medchat-core-linux-x64-gnu
          path: medchat-v2/core/medchat-core.linux-x64-gnu.node
          if-no-files-found: error

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  fuzz-smoke:
    name: Fuzz smoke (cargo-fuzz, nightly + ASan, ограниченные итерации)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # cargo-fuzz требует nightly: -Zsanitizer-флаги и sancov.
      - name: Setup Rust (nightly)
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            medchat-v2/core
            medchat-v2/core/fuzz

      - name: Install cargo-fuzz
        run: cargo install --locked cargo-fuzz

      # Smoke-режим: фиксированное число итераций на цель. DoD этапа 2
      # «cargo-fuzz без падений 24 ч» — суточный прогон отдельным запуском
      # по требованию; в CI гейтится сборка целей и отсутствие крашей на
      # коротком прогоне (ASan-инструментация ловит memory-баги).
      - name: fuzz open_sealed_fuzz (враждебный конверт)
        run: |
          set -o pipefail
          cargo fuzz run open_sealed_fuzz -- -runs=5000 2>&1 | tee ../../ci-fuzz.log

      - name: fuzz ratchet_wire_fuzz (мусорный wire + decrypt)
        run: |
          set -o pipefail
          cargo fuzz run ratchet_wire_fuzz -- -runs=5000 2>&1 | tee -a ../../ci-fuzz.log

      - name: fuzz ratchet_roundtrip_fuzz (произвольный plaintext)
        run: |
          set -o pipefail
          cargo fuzz run ratchet_roundtrip_fuzz -- -runs=5000 2>&1 | tee -a ../../ci-fuzz.log

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  core-audit:
    name: Rust dependency audit (cargo-audit, §4 ROADMAP)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Install cargo-audit
        run: cargo install --locked cargo-audit

      - name: Generate lockfile (Cargo.lock не в репо)
        run: cargo generate-lockfile

      - name: Audit dependencies (RUSTSEC advisory DB)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo audit; } 2>&1 | tee ../../ci-audit.log

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  uniffi-bindings:
    name: UniFFI bindings (Swift/Kotlin generation smoke)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: medchat-v2/core

      # Установка CLI из git-тега v0.32.2 (прогоны #105–#107: семейство
      # uniffi-крейтов отсутствует в sparse-индексе crates.io — cargo
      # «could not find uniffi-bindgen in registry crates-io» на любую
      # версию, ни --version, ни фолбэк без --locked не спасают: нет самой
      # индексной записи, при живых метаданных crates.io API). Git-тег
      # фиксирует точную версию (CLI обязан совпадать с крейтом — формат
      # metadata меняется между minor; крейт в Cargo.toml — тот же тег),
      # внутренние зависимости bindgen идут path-депами workspace —
      # реестр для них не нужен. Диагностируемость (урок #105): вывод
      # пишется в ci-uniffi.log с первой команды (заголовок прогона для
      # сверки метки времени, cargo --version для контекста).
      # Прогон #108 (run 42479207992): тег резолвится, но пакета
      # uniffi-bindgen в workspace v0.32.2 НЕТ — имя пакета crates.io
      # не обязано совпадать с git-workspace: CLI на этом теге —
      # пакет uniffi-bindgen-cli (member examples/app/uniffi-bindgen-cli,
      # publish=false), бинарь называется uniffi-bindgen-cli ([[bin]] name).
      # cargo install ищет ПАКЕТ по имени среди workspace-мемберов;
      # ставим uniffi-bindgen-cli и вызываем генерацию именно этим бинарем:
      # прогон #208 (run 42591454597) вызывал несуществующий uniffi-bindgen —
      # в PATH находился чужой/устаревший бинарь 0.28.3-эры, его читатель
      # метаданных падал («Invalid string data», ios/android).
      - name: Install uniffi-bindgen (v0.32.2 from git)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo --version; cargo install --git https://github.com/mozilla/uniffi-rs --tag v0.32.2 uniffi-bindgen-cli; } 2>&1 | tee ../../ci-uniffi.log

      # cdylib с UniFFI-scaffolding (без napi): release нужен для runtime smoke,
      # debug (без LTO) — для bindgen metadata extraction; serde добавляет
      # MedRatchetState.save()/restore() в экспорт (этап 7).
      - name: Build cdylib with UniFFI scaffolding
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo build --release --no-default-features --features uniffi-bind,serde; cargo build --no-default-features --features uniffi-bind,serde; } 2>&1 | tee ../../ci-uniffi.log

      # В отличие от napi-обёрток, uniffi-код линкуется в тестовый бинарник
      # чисто (metadata-функции — обычный Rust) — гоняем юнит-тесты обёрток.
      - name: Run uniffi wrapper unit tests
        run: |
          set -o pipefail
          { cargo test --no-default-features --features uniffi-bind,serde; } 2>&1 | tee -a ../../ci-uniffi.log

      # Генерация обвязки из debug cdylib (без LTO): release-артефакт остаётся
      # для runtime smoke; debug используется только для metadata extraction. Сгенерированная
      # обвязка гейтится в ios-smoke (Swift, macOS) и android-smoke
      # (Kotlin, ubuntu); сборка приложений (Xcode/Gradle) — на целевой
      # машине разработчика (этапы 3/4).
      - name: Diagnose UniFFI metadata extraction
        run: |
          set -o pipefail
          cargo run --example inspect_uniffi_metadata --no-default-features --features uniffi-bind,serde -- target/debug/libmedchat_core.so 2>&1 | tee -a ../../ci-uniffi.log

      - name: Generate Kotlin bindings
        run: |
          set -o pipefail
          { uniffi-bindgen-cli generate --library target/debug/libmedchat_core.so --language kotlin --out-dir uniffi-out/kotlin; } 2>&1 | tee -a ../../ci-uniffi.log

      - name: Generate Swift bindings
        run: |
          set -o pipefail
          { uniffi-bindgen-cli generate --library target/debug/libmedchat_core.so --language swift --out-dir uniffi-out/swift; } 2>&1 | tee -a ../../ci-uniffi.log

      - name: Upload uniffi bindings artifact
        uses: actions/upload-artifact@v7
        with:
          name: medchat-core-uniffi-bindings
          path: medchat-v2/core/uniffi-out/
          if-no-files-found: error

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  ios-smoke:
    name: iOS smoke (UniFFI Swift, этап 3)
    runs-on: macos-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable + iOS targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-ios,aarch64-apple-ios-sim

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: medchat-v2/core

      # Тот же git-тег v0.32.2, что в джобе uniffi-bindings и Cargo.toml
      # ядра: формат metadata привязан к версии крейта и CLI.
      - name: Install uniffi-bindgen (v0.32.2 from git)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo --version; cargo install --git https://github.com/mozilla/uniffi-rs --tag v0.32.2 uniffi-bindgen-cli; } 2>&1 | tee ../../ci-ios.log

      # host-cdylib: debug cdylib используется bindgen для metadata extraction,
      # release cdylib — для runtime-smoke ниже.
      - name: Build host cdylib with UniFFI scaffolding
        run: |
          set -o pipefail
          { cargo build --release --no-default-features --features uniffi-bind,serde; cargo build --no-default-features --features uniffi-bind,serde; } 2>&1 | tee -a ../../ci-ios.log

      - name: Generate Swift bindings
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-ios.log) 2>&1
          echo "[ci-ios] generate swift bindings: start"
          uniffi-bindgen-cli generate --library target/debug/libmedchat_core.dylib --language swift --out-dir uniffi-out/swift
          echo "[ci-ios] generated files:"
          ls -la uniffi-out/swift

      # Имя сгенерированного *.swift не фиксируем (glob), заголовок ищем
      # по маске *.h: bindgen 0.32 кладёт MedchatCoreFFI.h рядом.
      # Прогон #136: swiftc запрещает top-level-выражения вне файла
      # main.swift (expressions are not allowed at the top level) —
      # smoke-файл копируется под этим именем перед компиляцией.
      - name: Swift smoke (runtime, зеркало napi-smoke.js)
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-ios.log) 2>&1
          echo "[ci-ios] swift smoke: start"
          HEADER=$(ls uniffi-out/swift/*.h | head -n 1 || true)
          if [ -z "$HEADER" ]; then
            echo "[ci-ios] FAIL: *.h not found in uniffi-out/swift"
            ls -la uniffi-out/swift
            exit 1
          fi
          echo "[ci-ios] header: $HEADER"
          mkdir -p smoke-main
          cp ../ios/MedchatCoreSmoke.swift smoke-main/main.swift
          echo "[ci-ios] compiling swiftc (обвязка + smoke как main.swift)"
          swiftc uniffi-out/swift/*.swift smoke-main/main.swift \
              -import-objc-header "$HEADER" \
              -L target/release -lmedchat_core \
              -Xlinker -rpath -Xlinker "$PWD/target/release" \
              -o swift-smoke-bin
          echo "[ci-ios] running swift-smoke-bin"
          ./swift-smoke-bin
          echo "[ci-ios] swift smoke: done"

      # Этап 3 ч.2: typecheck каркаса SwiftUI-источников клиента.
      # Исходники ios/*.swift компилируются ВМЕСТЕ со сгенерированной
      # обвязкой (один модуль, без import MedchatCore — тот же путь, что
      # описан в README_IOS.md для Xcode-проекта оператора), так что
      # компиляция каркаса гейтится в CI до появления Xcode-проекта.
      - name: Typecheck SwiftUI sources (ios/, этап 3 ч.2)
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-ios.log) 2>&1
          echo "[ci-ios] typecheck SwiftUI sources: start"
          HEADER=$(ls uniffi-out/swift/*.h | head -n 1 || true)
          swiftc -typecheck uniffi-out/swift/*.swift \
              ../ios/MedChatApp.swift ../ios/ApiService.swift ../ios/KeychainStore.swift \
              ../ios/CryptoService.swift ../ios/RatchetService.swift ../ios/AuthViews.swift \
              ../ios/ChatListView.swift ../ios/ChatView.swift \
              ../ios/LoaderBallView.swift \
              -import-objc-header "$HEADER"
          echo "[ci-ios] typecheck: ok"

      # Кросс-компиляция под устройство и симулятор: staticlib (dylib на
      # iOS запрещены App Store) — cargo rustc --crate-type override,
      # Cargo.toml ядра не трогаем. Гейтит сборку против iOS SDK (Xcode на
      # раннере macos-latest).
      - name: Cross-compile iOS device + simulator (staticlib)
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-ios.log) 2>&1
          echo "[ci-ios] cross-compile iOS device (staticlib): start"
          cargo rustc --release --no-default-features --features uniffi-bind,serde --target aarch64-apple-ios -- --crate-type staticlib
          echo "[ci-ios] cross-compile simulator (staticlib): start"
          cargo rustc --release --no-default-features --features uniffi-bind,serde --target aarch64-apple-ios-sim -- --crate-type staticlib
          # override crate-type НЕ продвигается в release-корень (cargo
          # продвигает только типы из [lib] манифеста) — .a лежит в deps/
          # с hash-суффиксом; находим и кладём в путь, ожидаемый xcframework.
          echo "[ci-ios] locating device staticlib"
          DEV_A=$(find target/aarch64-apple-ios/release -name "libmedchat_core*.a" | head -n 1 || true)
          if [ -z "$DEV_A" ]; then
            echo "[ci-ios] FAIL: libmedchat_core*.a not found (aarch64-apple-ios)"
            find target/aarch64-apple-ios -name "libmedchat_core*" -type f | head -n 20
            exit 1
          fi
          echo "[ci-ios] device staticlib: $DEV_A"
          [ "$DEV_A" = "target/aarch64-apple-ios/release/libmedchat_core.a" ] || cp "$DEV_A" target/aarch64-apple-ios/release/libmedchat_core.a
          echo "[ci-ios] locating simulator staticlib"
          SIM_A=$(find target/aarch64-apple-ios-sim/release -name "libmedchat_core*.a" | head -n 1 || true)
          if [ -z "$SIM_A" ]; then
            echo "[ci-ios] FAIL: libmedchat_core*.a not found (aarch64-apple-ios-sim)"
            find target/aarch64-apple-ios-sim -name "libmedchat_core*" -type f | head -n 20
            exit 1
          fi
          echo "[ci-ios] simulator staticlib: $SIM_A"
          [ "$SIM_A" = "target/aarch64-apple-ios-sim/release/libmedchat_core.a" ] || cp "$SIM_A" target/aarch64-apple-ios-sim/release/libmedchat_core.a
          ls -la target/aarch64-apple-ios/release/libmedchat_core.a
          ls -la target/aarch64-apple-ios-sim/release/libmedchat_core.a

      - name: Assemble MedchatCore.xcframework
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-ios.log) 2>&1
          echo "[ci-ios] assembling xcframework: start"
          mkdir -p xcframework-headers/ios xcframework-headers/sim
          cp uniffi-out/swift/*.h uniffi-out/swift/*.modulemap xcframework-headers/ios/
          cp uniffi-out/swift/*.h uniffi-out/swift/*.modulemap xcframework-headers/sim/
          xcodebuild -create-xcframework \
              -library target/aarch64-apple-ios/release/libmedchat_core.a -headers xcframework-headers/ios \
              -library target/aarch64-apple-ios-sim/release/libmedchat_core.a -headers xcframework-headers/sim \
              -output MedchatCore.xcframework
          echo "[ci-ios] xcframework: done"

      - name: Upload MedchatCore.xcframework
        uses: actions/upload-artifact@v7
        with:
          name: medchat-core-xcframework
          path: medchat-v2/core/MedchatCore.xcframework
          if-no-files-found: error

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  android-smoke:
    name: Android smoke (UniFFI Kotlin, этап 4)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/core
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable + Android targets)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: medchat-v2/core

      - name: Setup Java 17 (kotlinc + runtime JVM)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      # Тот же git-тег v0.32.2, что в uniffi-bindings/ios-smoke и Cargo.toml
      # ядра: формат metadata привязан к версии крейта и CLI.
      - name: Install uniffi-bindgen (v0.32.2 from git)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo --version; cargo install --git https://github.com/mozilla/uniffi-rs --tag v0.32.2 uniffi-bindgen-cli; } 2>&1 | tee ../../ci-android.log

      # host-cdylib: по нему bindgen читает metadata (library mode) и против
      # него исполняется runtime-smoke ниже (JNA грузит libmedchat_core.so).
      - name: Build host cdylib with UniFFI scaffolding
        run: |
          set -o pipefail
          { cargo build --release --no-default-features --features uniffi-bind,serde; cargo build --no-default-features --features uniffi-bind,serde; } 2>&1 | tee -a ../../ci-android.log

      - name: Generate Kotlin bindings
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-android.log) 2>&1
          echo "[ci-android] generate kotlin bindings: start"
          uniffi-bindgen-cli generate --library target/debug/libmedchat_core.so --language kotlin --out-dir uniffi-out/kotlin
          echo "[ci-android] generated files:"
          ls -la uniffi-out/kotlin

      # kotlinc 2.0.21 (zip из GitHub Releases JetBrains) + JNA 5.14.0:
      # smoke компилируется с обвязкой и исполняется JVM против host-cdylib.
      - name: Install kotlinc + JNA
        run: |
          set -e
          exec > >(tee -a ../../ci-android.log) 2>&1
          fetch_retry() {
            url="$1"; dest="$2"
            for attempt in 1 2 3 4 5; do
              echo "[ci-android] download attempt ${attempt}: ${url}"
              if curl -fsSL "$url" -o "$dest"; then
                return 0
              fi
              echo "[ci-android] attempt ${attempt} failed, retry in 15s (транзиентные 504, run 42568107454)"
              sleep 15
            done
            echo "[ci-android] FAILED to download ${url}" >&2
            return 1
          }
          echo "[ci-android] downloading kotlinc 2.0.21"
          fetch_retry "https://github.com/JetBrains/kotlin/releases/download/v2.0.21/kotlin-compiler-2.0.21.zip" /tmp/kotlinc.zip
          unzip -q /tmp/kotlinc.zip -d /opt
          /opt/kotlinc/bin/kotlinc -version
          echo "[ci-android] downloading JNA 5.14.0"
          fetch_retry "https://repo1.maven.org/maven2/net/java/dev/jna/jna/5.14.0/jna-5.14.0.jar" /tmp/jna.jar
          ls -la /tmp/jna.jar

      # package-строку сгенерированной обвязки не фиксируем: smoke-файл
      # компилируется ВМЕСТЕ с обвязкой в одном пакете, имена разрешаются
      # по факту сгенерированного пакета.
      - name: Kotlin smoke (runtime, зеркало napi-smoke.js)
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-android.log) 2>&1
          echo "[ci-android] kotlin smoke: start"
          # bindgen 0.32 кладёт обвязку в подкаталог пакета
          # (uniffi-out/kotlin/uniffi/<ns>/), а не в сам out-dir:
          # glob uniffi-out/kotlin/*.kt пуст — ищем рекурсивно.
          PKG=$(grep -rh -m1 --include="*.kt" "^package " uniffi-out/kotlin | head -n 1 | sed "s/^package //" | tr -d "\r" || true)
          if [ -z "$PKG" ]; then
            echo "[ci-android] FAIL: package line not found in uniffi-out/kotlin"
            find uniffi-out/kotlin -type f -ls
            exit 1
          fi
          echo "[ci-android] kotlin package: $PKG"
          KT_FILES=$(find uniffi-out/kotlin -name "*.kt" || true)
          if [ -z "$KT_FILES" ]; then
            echo "[ci-android] FAIL: no *.kt in uniffi-out/kotlin"
            find uniffi-out/kotlin -type f -ls
            exit 1
          fi
          mkdir -p smoke-kotlin smoke-classes
          { echo "package $PKG"; cat ../android/MedchatCoreSmoke.kt; } > smoke-kotlin/MedchatCoreSmoke.kt
          echo "[ci-android] compiling kotlinc (обвязка + smoke)"
          /opt/kotlinc/bin/kotlinc $KT_FILES smoke-kotlin/MedchatCoreSmoke.kt -cp /tmp/jna.jar -d smoke-classes
          echo "[ci-android] running smoke in JVM via JNA (host cdylib)"
          # kotlin-stdlib обязательна в РАНТАЙМ-класспасе: kotlinc
          # подставляет её для компиляции сам, но голый java — нет
          # (run 42520064455: NoClassDefFoundError
          # kotlin/jvm/functions/Function0 в UniffiLib.<clinit>).
          STDLIB=$(find /opt/kotlinc -name "kotlin-stdlib.jar" | head -n 1 || true)
          if [ -z "$STDLIB" ]; then
            echo "[ci-android] FAIL: kotlin-stdlib.jar not found in /opt/kotlinc"
            find /opt/kotlinc -name "*.jar" | head -n 20
            exit 1
          fi
          echo "[ci-android] kotlin-stdlib: $STDLIB"
          java -Djna.library.path="$PWD/target/release" -cp "$STDLIB:/tmp/jna.jar:smoke-classes" "$PKG.MedchatCoreSmokeKt"
          echo "[ci-android] kotlin smoke: done"

      # Этап 4: typecheck сервисов каркаса. Сервисы живут в Gradle-проекте
      # (app/src/main/java/medchat/android, package medchat.android,
      # import uniffi.medchat_core) и не тянут androidx — поэтому их можно
      # проверять kotlinc против android.jar + JNA; UI-файлы (Compose)
      # гейтит джоба android-build через Gradle. Пакет обвязки проверяем
      # явно, чтобы drift namespace ловился внятной ошибкой.
      - name: Typecheck Kotlin sources (android services, этап 4)
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-android.log) 2>&1
          echo "[ci-android] typecheck kotlin sources: start"
          ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name "android.jar" 2>/dev/null | sort -V | tail -n 1 || true)
          if [ -z "$ANDROID_JAR" ]; then
            echo "[ci-android] android.jar not found — installing platform android-34 via sdkmanager"
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "platforms;android-34" > /dev/null 2>&1 || true
            ANDROID_JAR=$(find "$ANDROID_HOME/platforms" -maxdepth 2 -name "android.jar" 2>/dev/null | sort -V | tail -n 1 || true)
          fi
          if [ -z "$ANDROID_JAR" ]; then
            echo "[ci-android] FAIL: android.jar not found"
            ls -la "$ANDROID_HOME" || true
            ls -la "$ANDROID_HOME/platforms" 2>/dev/null || true
            exit 1
          fi
          echo "[ci-android] android.jar: $ANDROID_JAR"
          PKG=$(grep -rh -m1 --include="*.kt" "^package " uniffi-out/kotlin | head -n 1 | sed "s/^package //" | tr -d "\r" || true)
          if [ -z "$PKG" ]; then
            echo "[ci-android] FAIL: package line not found in uniffi-out/kotlin"
            find uniffi-out/kotlin -type f -ls
            exit 1
          fi
          if [ "$PKG" != "uniffi.medchat_core" ]; then
            echo "[ci-android] FAIL: unexpected bindings package '$PKG' (services import uniffi.medchat_core)"
            exit 1
          fi
          mkdir -p skeleton-classes
          echo "[ci-android] compiling kotlinc (обвязка + сервисы против android.jar)"
          KT_FILES=$(find uniffi-out/kotlin -name "*.kt" || true)
          /opt/kotlinc/bin/kotlinc $KT_FILES \
              ../android/app/src/main/java/medchat/android/ApiService.kt \
              ../android/app/src/main/java/medchat/android/SecureStore.kt \
              ../android/app/src/main/java/medchat/android/CryptoService.kt \
              ../android/app/src/main/java/medchat/android/RatchetService.kt \
              -cp "/tmp/jna.jar:$ANDROID_JAR" -d skeleton-classes
          echo "[ci-android] typecheck: ok"

      - name: Install Android NDK r27c
        run: |
          set -e
          exec > >(tee -a ../../ci-android.log) 2>&1
          echo "[ci-android] downloading NDK r27c"
          fetch_retry() {
            url="$1"; dest="$2"
            for attempt in 1 2 3 4 5; do
              echo "[ci-android] download attempt ${attempt}: ${url}"
              if curl -fsSL "$url" -o "$dest"; then
                return 0
              fi
              echo "[ci-android] attempt ${attempt} failed, retry in 15s"
              sleep 15
            done
            echo "[ci-android] FAILED to download ${url}" >&2
            return 1
          }
          fetch_retry "https://dl.google.com/android/repository/android-ndk-r27c-linux.zip" /tmp/ndk.zip
          unzip -q /tmp/ndk.zip -d /opt
          ls /opt/android-ndk-r27c/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-ar

      # Кросс-компиляция под устройства: cargo-ndk подставляет линкер NDK
      # для трёх ABI (api 21), .so — jniLibs для Gradle-проекта оператора.
      - name: Cross-compile .so via cargo-ndk (3 ABI)
        run: |
          set -o pipefail
          exec > >(tee -a ../../ci-android.log) 2>&1
          echo "[ci-android] installing cargo-ndk"
          cargo install --locked cargo-ndk
          echo "[ci-android] cross-compiling 3 ABI (api 21)"
          # NB (run 42520309135): в cargo-ndk 4.x флаг платформы —
          # -P/--platform (заглавная P; default_value 21). Строчная -p
          # НЕ принадлежит cargo-ndk и уезжает в cargo-аргументы, где
          # трактуется как --package 21 — паника «unknown package: 21».
          # ANDROID_NDK_ROOT выравниваем с нашей зафиксированной NDK,
          # иначе cargo-ndk предупреждает о несовпадении с
          # предустановленной NDK раннера (warning, но шумно).
          ANDROID_NDK_HOME=/opt/android-ndk-r27c ANDROID_NDK_ROOT=/opt/android-ndk-r27c cargo ndk -t arm64-v8a -t armeabi-v7a -t x86_64 --platform 21 build --release --no-default-features --features uniffi-bind,serde
          ls -la target/aarch64-linux-android/release/libmedchat_core.so
          ls -la target/armv7-linux-androideabi/release/libmedchat_core.so
          ls -la target/x86_64-linux-android/release/libmedchat_core.so

      - name: Upload android .so artifact
        uses: actions/upload-artifact@v7
        with:
          name: medchat-core-android
          path: |
            medchat-v2/core/target/aarch64-linux-android/release/libmedchat_core.so
            medchat-v2/core/target/armv7-linux-androideabi/release/libmedchat_core.so
            medchat-v2/core/target/x86_64-linux-android/release/libmedchat_core.so
          if-no-files-found: error

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  android-build:
    name: Android Gradle build (Compose UI, этап 4 ч.3)
    needs: [uniffi-bindings, android-smoke]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Download UniFFI bindings artifact
        uses: actions/download-artifact@v8
        with:
          name: medchat-core-uniffi-bindings
          path: bindings

      - name: Download android .so artifact (jniLibs)
        uses: actions/download-artifact@v8
        with:
          name: medchat-core-android
          path: solib

      # bindgen 0.32 кладёт обвязку в <out>/kotlin/uniffi/<namespace>/;
      # app-источники импортируют uniffi.medchat_core. download-artifact
      # кладёт артефакты в корень workspace (defaults.run на uses не
      # действует) — отсюда ../../ в путях шага ниже.
      - name: Stage bindings and jniLibs into the Gradle project
        run: |
          set -e
          mkdir -p app/src/main/java
          cp -r ../../bindings/kotlin/uniffi app/src/main/java/
          mkdir -p app/src/main/jniLibs/arm64-v8a app/src/main/jniLibs/armeabi-v7a app/src/main/jniLibs/x86_64
          cp ../../solib/aarch64-linux-android/release/libmedchat_core.so app/src/main/jniLibs/arm64-v8a/
          cp ../../solib/armv7-linux-androideabi/release/libmedchat_core.so app/src/main/jniLibs/armeabi-v7a/
          cp ../../solib/x86_64-linux-android/release/libmedchat_core.so app/src/main/jniLibs/x86_64/
          echo "[ci-android-build] staged bindings:"
          find app/src/main/java/uniffi -name "*.kt"
          echo "[ci-android-build] staged jniLibs:"
          find app/src/main/jniLibs -name "*.so"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # unsigned debug-APK: гейтит Gradle-проект, Compose UI, JNA@aar и
      # компиляцию app-источников вместе с UniFFI-обвязкой.
      # NB (run 42572808358): Maven Central редиректит большие артефакты
      # (kotlin-compiler-embeddable) на GitHub Releases CDN, который
      # транзиентно отдаёт 504 (инцидент 2026-11-08/09) — ретраи по
      # образцу desktop-bundle; Gradle кэширует уже скачанное, повтор
      # дёшев. tee -a накапливает лог всех попыток.
      - name: Build debug APK (assembleDebug)
        run: |
          set -o pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "[ci-android-build] build attempt $attempt"
            { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) === attempt $attempt"; gradle :app:assembleDebug --no-daemon; } 2>&1 | tee -a ../../ci-android-build.log && ok=1 && break
            echo "[ci-android-build] attempt $attempt failed, retry in 25s (транзиентные 504 на Maven Central/GitHub CDN)"
            sleep 25
          done
          if [ "$ok" != "1" ]; then exit 1; fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: medchat-android-debug-apk
          path: medchat-v2/android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  server-mock-apk:
    name: Server mock APK (тестовый сервер для телефонов)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/server-mock-android
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Java 17
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.9'

      # Ретраи как в android-build: Maven Central редиректит большие
      # артефакты на GitHub CDN, который транзиентно отдаёт 504.
      - name: Build debug APK (assembleDebug)
        run: |
          set -o pipefail
          ok=0
          for attempt in 1 2 3 4 5; do
            echo "[ci-server-mock] build attempt $attempt"
            { echo "=== run \${GITHUB_RUN_ID} job \${GITHUB_JOB} $(date -u) === attempt $attempt"; gradle :app:assembleDebug --no-daemon; } 2>&1 | tee -a ../../ci-server-mock.log && ok=1 && break
            echo "[ci-server-mock] attempt $attempt failed, retry in 25s (транзиентные 504 на Maven Central/GitHub CDN)"
            sleep 25
          done
          if [ "$ok" != "1" ]; then exit 1; fi

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v7
        with:
          name: medchat-server-mock-apk
          path: medchat-v2/server-mock-android/app/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  desktop-check:
    name: Desktop check (Tauri 2 scaffold, этап 5 ROADMAP_NATIVE)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/desktop/src-tauri
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Rust (stable)
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            medchat-v2/core
            medchat-v2/desktop/src-tauri

      # wry/tao на Linux собираются против webkit2gtk/gtk: их -sys-крейты
      # проверяют системные библиотеки pkg-config'ом уже на этапе cargo
      # check (build-скрипты выполняются и без линковки) — стандартный
      # набор системных зависимостей Tauri для Linux.
      - name: Install system deps (webkit2gtk)
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; cargo --version; sudo apt-get update; sudo apt-get install -y libwebkit2gtk-4.1-dev; } 2>&1 | tee ../../../ci-desktop.log

      # cargo check гейтит: tauri.conf.json валиден (build.rs tauri-build
      # валидирует конфиг), дерево tauri 2 резолвится, команды-пробы
      # core_probe/ratchet_probe/ratchet_storage_probe типо-совместимы
      # с medchat-core (path-деп Rust -> Rust, default-features = false,
      # features serde: персистентность RatchetState) и с keyring
      # (secure storage этапа 5; dbus-secret-service — чистый Rust на
      # zbus, системных -dev-пакетов не требует). Сборка
      # установщиков (.deb/AppImage/.exe) — джоба desktop-bundle (этап 5).
      - name: Type-check Tauri app + core integration
        run: |
          set -o pipefail
          { cargo check --all-targets; } 2>&1 | tee -a ../../../ci-desktop.log

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  desktop-bundle:
    name: Desktop installers (Tauri 2, matrix ubuntu/windows)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            bundles: deb,appimage
            artifact: medchat-desktop-linux
          - os: windows-latest
            bundles: nsis
            artifact: medchat-desktop-nsis
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: medchat-v2/desktop
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo (desktop + core path-dep)
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            medchat-v2/core
            medchat-v2/desktop/src-tauri

      - name: Linux build deps
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libfuse2

      - name: Node.js 20 (tauri CLI через npx)
        uses: actions/setup-node@v7
        with:
          node-version: '20'

      # Прогрев кэша бандлера (инцидент с 09:00 UTC 2026-11-08: GitHub
      # Releases CDN часами отдаёт 504 на binary-releases tauri-apps; runs
      # 42568107454, 42568745549, 42569564665). Имена файлов в tools-папке
      # бандлера (=2.10.4, src/bundle/linux/appimage/linuxdeploy.rs,
      # докачивает только if !path.exists()): AppRun-x86_64,
      # linuxdeploy-07333c6-x86_64.AppImage (тег релиза в имени файла!),
      # linuxdeploy-plugin-appimage.AppImage (БЕЗ арх-суффикса). Четвёртая
      # закачка скрыта в логе бандлера: appimagetool внутри linuxdeploy качает
      # AppImage-runtime (type2-runtime continuous) в момент бандлинга —
      # прогреваем и её, подсунув через LDAI_RUNTIME_FILE в шаге
      # Build installers. Best-effort: неудача не роняет джобу, остаются
      # ретраи сборки.
      - name: Prewarm tauri bundler cache (AppImage tooling)
        if: matrix.os == 'ubuntu-latest'
        shell: bash
        run: |
          set -e
          mkdir -p "$HOME/.cache/tauri"
          prewarm() {
            url="$1"; dest="$2"
            for attempt in 1 2 3 4 5; do
              echo "[prewarm] ${url}: attempt ${attempt}"
              if curl -fL --retry 3 --retry-delay 5 -o "$dest" "$url"; then
                return 0
              fi
              echo "[prewarm] ${url}: attempt ${attempt} failed, retry in 10s"
              sleep 10
            done
            rm -f "$dest"
            echo "[prewarm] WARNING: could not prewarm ${url}" >&2
            return 0
          }
          prewarm "https://github.com/tauri-apps/binary-releases/releases/download/apprun-old/AppRun-x86_64" "$HOME/.cache/tauri/AppRun-x86_64"
          chmod +x "$HOME/.cache/tauri/AppRun-x86_64" || true
          prewarm "https://github.com/tauri-apps/binary-releases/releases/download/linuxdeploy-07333c6/linuxdeploy-x86_64.AppImage" "$HOME/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-07333c6-x86_64.AppImage" || true
          prewarm "https://github.com/linuxdeploy/linuxdeploy-plugin-appimage/releases/download/continuous/linuxdeploy-plugin-appimage-x86_64.AppImage" "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage"
          chmod +x "$HOME/.cache/tauri/linuxdeploy-plugin-appimage.AppImage" || true
          prewarm "https://github.com/AppImage/type2-runtime/releases/download/continuous/runtime-x86_64" "$HOME/.cache/tauri/runtime-x86_64"
          chmod 0644 "$HOME/.cache/tauri/runtime-x86_64" || true
          ls -la "$HOME/.cache/tauri"

      # Ретрай сборки установщиков: cargo-кэш делает повторы дёшевыми
      # (сборка уже в кэше); tee -a накапливает лог всех попыток.
      - name: Build installers
        shell: bash
        run: |
          set -o pipefail
          if [ -f "$HOME/.cache/tauri/runtime-x86_64" ]; then
            export LDAI_RUNTIME_FILE="$HOME/.cache/tauri/runtime-x86_64"
            echo "[ci-desktop-bundle] LDAI_RUNTIME_FILE=$LDAI_RUNTIME_FILE"
          fi
          ok=0
          for attempt in 1 2 3 4 5 6 7 8; do
            echo "[ci-desktop-bundle] build attempt $attempt"
            { npx --yes @tauri-apps/cli@2 build --bundles ${{ matrix.bundles }}; } 2>&1 | tee -a ../../ci-desktop-bundle.log && ok=1 && break
            echo "[ci-desktop-bundle] attempt $attempt failed, retry in 25s (транзиентные 504 на download-тулинге)"
            sleep 25
          done
          if [ "$ok" != "1" ]; then exit 1; fi

      - name: Upload installers
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          if-no-files-found: warn
          path: |
            medchat-v2/desktop/src-tauri/target/release/bundle/deb/*.deb
            medchat-v2/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            medchat-v2/desktop/src-tauri/target/release/bundle/nsis/*.exe

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7
  k6-load:
    name: k6 load smoke (этап 6 DoD, fixed profile)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medchat
          POSTGRES_PASSWORD: medchat
          # с NODE_ENV=test сервер добавляет "_test" к DB_NAME
          POSTGRES_DB: medchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: medchat
      DB_PASSWORD: medchat
      DB_NAME: medchat
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-k6-load-secret
      JWT_EXPIRES_IN: 30m
      JWT_REFRESH_EXPIRES_IN: 30d
      # только для нагрузочного стенда: логины идут потоком, прод-лимит
      # 10 за 15 мин защищает от брутфорса и здесь не нужен
      RATE_LIMIT_AUTH_MAX: 100000
      RATE_LIMIT_WINDOW_MS: 60000
      # базовый rateLimiter (дефолт 300/окно) тоже считает /api/auth/login —
      # двойной учёт с authRateLimiter; без подъёма k6-профиль упирается
      # в 300 логинов за прогон (run 42509394124: 300 ok / 543 429, порог
      # http_req_failed сорван). Прод-дефолт 300/15 мин не тронут.
      RATE_LIMIT_MAX_REQUESTS: 100000
    defaults:
      run:
        working-directory: medchat-v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js 22
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Install dependencies
        run: npm install

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 5432 && echo "Postgres is up" && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" && exit 1

      - name: Seed test data
        run: npm run seed:test

      - name: Start server in background
        run: |
          nohup node src/index.js > k6-server.log 2>&1 &
          for i in $(seq 1 30); do
            curl -sf http://localhost:3000/health > /dev/null && echo "server up" && exit 0
            sleep 2
          done
          echo "server did not become ready"
          tail -n 50 k6-server.log
          exit 1

      - name: Install k6
        run: |
          set -e
          K6_VERSION=v0.50.0
          curl -sSL "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" -o /tmp/k6.tar.gz
          tar -xzf /tmp/k6.tar.gz -C /tmp
          sudo mv /tmp/k6-${K6_VERSION}-linux-amd64/k6 /usr/local/bin/k6
          k6 version

      - name: Run k6 load smoke
        run: |
          set -o pipefail
          { echo "=== run ${GITHUB_RUN_ID} job ${GITHUB_JOB} $(date -u) ==="; k6 run load/k6-smoke.js; } 2>&1 | tee ../../ci-k6.log

      - name: Print server log on failure
        if: failure()
        run: |
          echo "k6 failed. Server output:"
          tail -n 100 k6-server.log

      - name: Upload CI diagnostic logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ci-diagnostics-${{ github.job }}
          path: |
            ci-*.log
            **/ci-*.log
          if-no-files-found: ignore
          retention-days: 7