name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run unit and integration tests
        run: npm test -- --ci --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 30d

  seed-check:
    name: Test data seed (dry run)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medchat
          POSTGRES_PASSWORD: medchat
          POSTGRES_DB: medchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: medchat-v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Run test data seed
        run: npm run seed:test
        env:
          NODE_ENV: test
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USER: medchat
          DB_PASSWORD: medchat
          DB_NAME: medchat_test
          DATABASE_URL: postgres://medchat:medchat@localhost:5432/medchat_test
