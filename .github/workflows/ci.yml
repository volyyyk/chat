name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  server-tests:
    name: Server tests (unit + integration)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: medchat-v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Lint (non-blocking)
        run: npm run lint
        continue-on-error: true

      - name: Run unit and integration tests
        run: npm test -- --ci --runInBand
        env:
          NODE_ENV: test
          JWT_SECRET: ci-test-secret
          JWT_EXPIRES_IN: 15m
          JWT_REFRESH_EXPIRES_IN: 30d

  e2e-smoke:
    name: E2E smoke (seed + все стороны, real-time, платежи)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: medchat
          POSTGRES_PASSWORD: medchat
          # NOTE: with NODE_ENV=test the server appends "_test" to DB_NAME,
          # so the real database name here must be DB_NAME + "_test"
          POSTGRES_DB: medchat_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    env:
      NODE_ENV: test
      DB_HOST: localhost
      DB_PORT: 5432
      DB_USER: medchat
      DB_PASSWORD: medchat
      DB_NAME: medchat
      REDIS_HOST: localhost
      REDIS_PORT: 6379
      JWT_SECRET: ci-e2e-secret
      JWT_EXPIRES_IN: 30m
      JWT_REFRESH_EXPIRES_IN: 30d
      MESSAGE_PRICE_RUB: 50
      FREE_MESSAGE_DAYS: 30
      DOCTOR_SHARE_PERCENT: 80
    defaults:
      run:
        working-directory: medchat-v2/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: npm install

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            nc -z localhost 5432 && echo "Postgres is up" && exit 0
            sleep 2
          done
          echo "Postgres did not become ready" && exit 1

      - name: Seed test data
        run: npm run seed:test

      - name: Run E2E smoke test
        run: npm run test:smoke

      - name: Print server logs on failure
        if: failure()
        run: |
          echo "Smoke test failed. Recent server output:"
          ls -la logs 2>/dev/null || true
          tail -n 200 logs/error.log 2>/dev/null || true
