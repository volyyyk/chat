# medchat-core — криптографическое ядро MedChat (этап 2 ROADMAP_NATIVE.md)
#
# X25519 + XSalsa20-Poly1305 (NaCl box) — тот же алгоритм, что в мобильном
# клиенте (tweetnacl), чтобы конверты E2E читались всеми клиентами платформы.
[package]
name = "medchat-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MedChat crypto core: X25519 + NaCl box envelope primitives (E2E-compatible with tweetnacl clients)"
rust-version = "1.65"

[dependencies]
crypto_box = "0.9"
# Double Ratchet (src/ratchet.rs): raw X25519 (DH-выход для KDF_RK),
# HMAC-SHA256 (цепочки KDF_RK/KDF_CK), AES-256-GCM (AEAD на message keys).
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"

[profile.release]
lto = true
codegen-units = 1
