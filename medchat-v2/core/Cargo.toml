# medchat-core — криптографическое ядро MedChat (этап 2 ROADMAP_NATIVE.md)
#
# X25519 + XSalsa20-Poly1305 (NaCl box) — тот же алгоритм, что в мобильном
# клиенте (tweetnacl), чтобы конверты E2E читались всеми клиентами платформы.
[package]
name = "medchat-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MedChat crypto core: X25519 + NaCl box envelope primitives (E2E-compatible with tweetnacl clients)"
# MSRV поднят 1.65 → 1.77: napi-build 2.6 эмитит инструкции сборки в синтаксисе
# `cargo::` (Rust >= 1.77); при заявленном rust-version ниже cargo отвергает
# билд-скрипт (ошибка прогона 754f677). CI гоняет stable — фактический floor
# определяется зависимостями (napi 2.16), 1.77 покрывает.
rust-version = "1.77"

# cdylib — .node-аддон для Node.js (napi-rs), rlib — cargo test и внутренние
# пользователи ядра (тесты, будущие UniFFI-оболочки).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# napi-биндинги (src/node.rs) — отдельная feature. Причина: `cargo test`
# линкует ИСПОЛНЯЕМЫЙ тестовый бинарник, а napi_*-символы в рантайме даёт
# только процесс Node; дистрибутив Node не содержит libnode.so (napi-rs
# issue #1099), поэтому линковщик не может разрешить их в тестовом
# бинарнике. Тесты логики ядра гоняются с --no-default-features (без
# биндингов линкуются чисто), компиляция node.rs и его #[cfg(test)]-кода
# проверяется в CI через `cargo check --tests` (type-check без линковки —
# ловит ошибки типов вроде E0277). Обычная разработка и сборка .node-артефакта
# (napi build) используют default: napi-bind включён.
default = ["napi-bind"]
napi-bind = ["dep:napi", "dep:napi-derive"]

[dependencies]
crypto_box = "0.9"
# Double Ratchet (src/ratchet.rs): raw X25519 (DH-выход для KDF_RK),
# HMAC-SHA256 (цепочки KDF_RK/KDF_CK), AES-256-GCM (AEAD на message keys).
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hmac = "0.12"
sha2 = "0.10"
aes-gcm = "0.10"
# bcrypt (src/lib.rs::bcrypt_verify): проверка паролей в формате OpenBSD
# ($2a$/$2b$/$2y$, любой cost) — паритет с сервером (нативный bcrypt-пакет,
# cost 12 в authService). Pure Rust (крейт blowfish), НЕ гейтится за
# feature napi-bind: включён и в --no-default-features-сборках.
bcrypt = "0.15"
# napi-rs (src/node.rs, feature napi-bind): Node.js-биндинги (этап 2).
# compat-mode — совместимость со старыми Node/Electron; default-features =
# false — минимальный рантайм (без tokio: наши обёртки синхронные).
# optional: тесты ядра собираются без биндингов (см. [features] выше).
napi = { version = "2", default-features = false, features = ["compat-mode"], optional = true }
napi-derive = { version = "2", optional = true }

[build-dependencies]
napi-build = "2"

[profile.release]
lto = true
codegen-units = 1