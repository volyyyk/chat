# medchat-core — криптографическое ядро MedChat (этап 2 ROADMAP_NATIVE.md)
#
# X25519 + XSalsa20-Poly1305 (NaCl box) — тот же алгоритм, что в мобильном
# клиенте (tweetnacl), чтобы конверты E2E читались всеми клиентами платформы.
[package]
name = "medchat-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "MedChat crypto core: X25519 + NaCl box envelope primitives (E2E-compatible with tweetnacl clients)"
# MSRV поднят 1.65 → 1.77: napi-build 2.6 эмитит инструкции сборки в синтаксисе
# `cargo::` (Rust >= 1.77); при заявленном rust-version ниже cargo отвергает
# билд-скрипт (ошибка прогона 754f677). CI гоняет stable — фактический floor
# определяется зависимостями (napi 2.16), 1.77 покрывает.
rust-version = "1.77"

# cdylib — .node-аддон для Node.js (napi-rs), rlib — cargo test и внутренние
# пользователи ядра (тесты, будущие UniFFI-оболочки).
[lib]
crate-type = ["cdylib", "rlib"]

[features]
# napi-биндинги (src/node.rs) — отдельная feature. Причина: `cargo test`
# линкует ИСПОЛНЯЕМЫЙ тестовый бинарник, а napi_*-символы в рантайме даёт
# только процесс Node; дистрибутив Node не содержит libnode.so (napi-rs
# issue #1099), поэтому линковщик не может разрешить их в тестовом
# бинарнике. Тесты логики ядра гоняются с --no-default-features (без
# биндингов линкуются чисто), компиляция node.rs и его #[cfg(test)]-кода
# проверяется в CI через `cargo check --tests` (type-check без линковки —
# ловит ошибки типов вроде E0277). Обычная разработка и сборка .node-артефакта
# (napi build) используют default: napi-bind включён.
default = ["napi-bind"]
napi-bind = ["dep:napi", "dep:napi-derive"]
# UniFFI-биндинги (src/uniffi_iface.rs) — Swift/Kotlin (этап 2). НЕ
# default: scaffolding/metadata не нужны в обычных прогонах ядра и сборке
# .node; включается джобой CI uniffi-bindings (cdylib + генерация обвязки
# + тесты обёрток).
uniffi-bind = ["dep:uniffi"]
# Сериализация RatchetState (serde derive, src/ratchet.rs) — персистентность
# сессий Double Ratchet между запусками (этап 7 ROADMAP: клиенты сохраняют
# состояние в secure storage устройства). НЕ default — как napi-bind/uniffi-bind:
# serde не нужен сборкам .node/cdylib без персистентности; CI-прогон ядра
# включает её: cargo test --no-default-features --features serde.
serde = ["dep:serde", "dep:bincode"]

[dependencies]
crypto_box = "0.9"
# Double Ratchet (src/ratchet.rs): raw X25519 (DH-выход для KDF_RK),
# HMAC-SHA256 (цепочки KDF_RK/KDF_CK), AES-256-GCM (AEAD на message keys).
x25519-dalek = { version = "2.0.1", features = ["static_secrets"] }
hmac = "0.13"
sha2 = "0.10"
aes-gcm = "0.10"
# flate2 (src/hotpath.rs, этап 6): gzip-сжатие бэкапов — второй серверный
# горячий путь (карта §1: «сжатие бэкапов»). Формат стандартный gzip
# (RFC 1952), читается node:zlib и любым gunzip (parity — napi-smoke.js).
# Бэкенд rust (miniz_oxide), C-кода не появляется.
flate2 = "1"
# bcrypt (src/lib.rs::bcrypt_verify): проверка паролей в формате OpenBSD
# ($2a$/$2b$/$2y$, любой cost) — паритет с сервером (нативный bcrypt-пакет,
# cost 12 в authService). Pure Rust (крейт blowfish), НЕ гейтится за
# feature napi-bind: включён и в --no-default-features-сборках.
bcrypt = "0.15"
# napi-rs (src/node.rs, feature napi-bind): Node.js-биндинги (этап 2).
# compat-mode — совместимость со старыми Node/Electron; default-features =
# false — минимальный рантайм (без tokio: наши обёртки синхронные).
# optional: тесты ядра собираются без биндингов (см. [features] выше).
napi = { version = "2", default-features = false, features = ["compat-mode"], optional = true }
napi-derive = { version = "2", optional = true }
# UniFFI (src/uniffi_iface.rs, feature uniffi-bind): биндинги Swift/Kotlin
# (этап 2 ROADMAP_NATIVE). Источник — git-тег v0.28.3 репозитория
# mozilla/uniffi-rs: семейство uniffi-крейтов ОТСУТСТВУЕТ в sparse-индексе
# crates.io (index.crates.io/un/iff/uniffi* → NoSuchKey; в CI cargo 1.99
# отвечает «could not find uniffi-bindgen in registry crates-io» на любую
# версию — прогоны #105–#107), при живых метаданных crates.io API.
# Git-тег фиксирует точную версию (CLI обязан совпадать с крейтом — формат
# metadata меняется между minor), внутренние зависимости uniffi
# (uniffi-macro, uniffi-meta) идут path-депами того же workspace —
# обращений к отсутствующим индекс-записям не остаётся. Cargo.lock в
# gitignore (библиотечный крейт) — правок лок-файла не требуется.
uniffi = { git = "https://github.com/mozilla/uniffi-rs", tag = "v0.28.3", optional = true }
# serde (feature serde, src/ratchet.rs): сериализация RatchetState для
# персистентности Double Ratchet (этап 7). Честно: JSON не подходит —
# ключи skip-store HashMap(([u8;32], u32)) нестроковые; формат персистентности
# — бинарный (bincode в тестах). derive: KeyPair (lib.rs) тоже сериализуется
# (поле dh_self состояния).
serde = { version = "1", features = ["derive"], optional = true }
# bincode (feature serde): бинарный формат персистентности RatchetState.
# Дублирует dev-зависимость: сериализация нужна теперь и ЛИБ-коду —
# методам save/restore биндингов (node.rs / uniffi_iface.rs), а не только
# тестам ratchet.rs (где bincode идёт как dev-зависимость).
bincode = { version = "1", optional = true }

[build-dependencies]
napi-build = "2"

# criterion — бенчмарки крипто-пути ядра (benches/crypto.rs), DoD этапа 2
# ROADMAP_NATIVE («бенчмарк ≥ x10 к Node на крипто-пути»). dev-зависимость:
# не участвует в сборке .node (napi build) и не запускается обычными
# прогонами ядра (cargo check --tests / cargo test --no-default-features).
[dev-dependencies]
criterion = "0.5"
# bincode — сериализационные тесты RatchetState (feature serde): бинарный
# формат с произвольными ключами HashMap (JSON нестроковые ключи не умеет).
bincode = "1"

# Бенчмарки запускает только cargo bench --no-default-features (джоба CI
# core-bench). harness = false: точка входа — criterion, а не libtest.
[[bench]]
name = "crypto"
harness = false

[profile.release]
lto = true
codegen-units = 1