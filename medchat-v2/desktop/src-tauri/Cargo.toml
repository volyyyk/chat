[package]
name = "medchat-desktop"
version = "0.1.0"
description = "MedChat Desktop — каркас этапа 5 ROADMAP_NATIVE.md (Tauri 2)"
edition = "2021"
rust-version = "1.77"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }

# Крипто-ядро — напрямую path-депом (Rust -> Rust): desktop — единственный
# клиент MedChat без биндингов (napi — Node, UniFFI — Swift/Kotlin).
# default-features = false: napi-bind не нужен; CoreError реализует
# Display + std::error::Error — ок для сообщений tauri-команд.
# features serde: сериализация RatchetState (bincode) — персистентность
# сессии Double Ratchet между запусками (этап 7): blob сохраняется в
# системном secure storage (ratchet_save/ratchet_load, см. main.rs).
medchat-core = { path = "../../core", default-features = false, features = ["serde"] }
# Бинарный формат персистентности RatchetState — тот же bincode 1, что и в
# ядре (feature serde): save/restore-путь desktop обязан сериализовать
# состояние так же, как это делают биндинги napi/UniFFI.
bincode = "1"

# E2E-конверты (этап 7): base64 — реестр публичных ключей и wire-формат
# конвертов (декод прощает отсутствие паддинга — мобильный клиент может
# слать unpadded); serde/serde_json — запись пары ключей устройства
# {keyId, publicKey, secretKey} в secure storage (сервис medchat.e2e)
# и типы аргументов/результатов tauri-команд e2e_*.
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Secure storage этапа 5 (ROADMAP «Секреты: Windows Credential Manager /
# libsecret (GNOME Keyring)»): крейт keyring 3 поверх системных хранилищ.
# Платформо-специфичные фичи через target-зависимости: Windows — Credential
# Manager (windows-native), Linux — libsecret/GNOME Keyring поверх D-Bus
# (sync-secret-service: dbus-secret-service — чистый Rust на zbus,
# системных -dev-пакетов не требует; crypto-rust — шифрование секрета
# в транспорте без системного OpenSSL).
[target.'cfg(target_os = "windows")'.dependencies]
keyring = { version = "3", features = ["windows-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3", features = ["sync-secret-service", "crypto-rust"] }
