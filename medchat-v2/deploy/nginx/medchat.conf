# MedChat: nginx — статика веб-клиента + reverse proxy (прод-контур, DEPLOY.md).
# Статика лежит в ./web (CRA build), API и Socket.IO — в сервисе server.
# TLS-сертификаты — оператор: блок ниже закомментирован (certbot / Let\u0027s Encrypt),
# порт 443 открывается в docker-compose.prod.yml вместе с сертификатами.

upstream medchat_server {
    server server:3000;
    keepalive 32;
}

server {
    listen 80;
    server_name _;

    # Файлы до 25 МБ (сервер сам принимает до 50 МБ, но реже)
    client_max_body_size 25m;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Живность контура: nginx и сервер отвечают одним и тем же /health
    location = /health {
        proxy_pass http://medchat_server/health;
        proxy_set_header Host $host;
        access_log off;
    }

    # REST API сервера MedChat
    location /api/ {
        proxy_pass http://medchat_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 65s;
    }

    # Socket.IO: long-polling + websocket upgrade
    location /socket.io/ {
        proxy_pass http://medchat_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 65s;
    }

    # Статика веб-клиента (CRA build), SPA-fallback на index.html
    location / {
        root /usr/share/nginx/html;
        try_files $uri $uri/ /index.html;
    }
}

